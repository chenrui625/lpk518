<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兼職徵才｜誠徵夥伴</title>
<style>
  :root{
    --orange:#ee4d2d;
    --orange-deep:#f53d2d;
    --line:#06c755;
    --ink:#222;
    --muted:#888;
    --bg:#f5f5f5;
    --card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:linear-gradient(180deg,#e9e9e9 0%,#f5f5f5 100%);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit;}

  /* 行動 App 容器：手機全寬、桌面居中窄條 */
  .app{
    width:100%;
    max-width:480px;
    background:var(--bg);
    min-height:100vh;
    box-shadow:0 0 40px rgba(0,0,0,.12);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:96px; /* 留空間給底部浮動按鈕 */
  }

  /* ── 頂部橘色 Header ── */
  .topbar{
    background:linear-gradient(135deg,#ff6b35 0%,var(--orange-deep) 100%);
    padding:14px 16px 16px;
  }
  .brand{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;
    background:#fff;display:grid;place-items:center;flex:none;
    font-weight:800;color:var(--orange-deep);font-size:16px;
    letter-spacing:-1px;
  }
  .brand-name{
    color:#fff;font-weight:800;font-size:19px;letter-spacing:.5px;
  }
  .brand-name small{
    display:block;font-size:11px;font-weight:500;opacity:.92;letter-spacing:2px;
  }
  .searchbar{
    background:#fff;border-radius:999px;height:38px;
    display:flex;align-items:center;gap:8px;padding:0 14px;
    color:#bdbdbd;font-size:13px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .searchbar svg{flex:none;opacity:.55;}

  /* ── Hero 主視覺 ── */
  .hero{
    margin:14px 14px 0;background:var(--card);
    border-radius:16px;padding:34px 24px;text-align:center;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 15% 0%,rgba(238,77,45,.10),transparent 55%),
               radial-gradient(circle at 85% 100%,rgba(238,77,45,.10),transparent 55%);
  }
  .badge{
    display:inline-block;background:rgba(238,77,45,.10);color:var(--orange-deep);
    font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;
    letter-spacing:1px;margin-bottom:16px;
  }
  .hero h1{
    font-size:32px;line-height:1.3;font-weight:800;letter-spacing:1px;
    position:relative;
  }
  .hero h1 .hot{color:var(--orange-deep);}
  .sub{
    margin-top:12px;color:var(--muted);font-size:14px;letter-spacing:1px;
    position:relative;
  }

  .btn-line{
    margin-top:26px;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--line);color:#fff;font-weight:700;font-size:16px;
    padding:15px 0;border-radius:999px;letter-spacing:1px;
    box-shadow:0 6px 18px rgba(6,199,85,.35);
    transition:transform .12s ease,box-shadow .12s ease;
    position:relative;
  }
  .btn-line:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(6,199,85,.42);}
  .btn-line:active{transform:translateY(0);}
  .btn-line svg{flex:none;}

  /* ── 賣點 grid（蝦皮分類感） ── */
  .perks{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    margin:14px 14px 0;
  }
  .perk{
    background:var(--card);border-radius:14px;padding:18px 8px 14px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .perk .ic{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#ff6b35,var(--orange-deep));
    display:grid;place-items:center;color:#fff;
  }
  .perk span{font-size:12px;font-weight:600;color:#444;text-align:center;}

  /* ── 底部浮動 LINE 按鈕 ── */
  .float{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    width:min(440px,calc(100% - 32px));
    background:var(--line);color:#fff;font-weight:800;font-size:16px;
    padding:16px 0;border-radius:999px;text-align:center;letter-spacing:1px;
    box-shadow:0 8px 24px rgba(6,199,85,.40);
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .12s ease,box-shadow .12s ease;
    z-index:10;
  }
  .float:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 10px 28px rgba(6,199,85,.48);}
  .float svg{flex:none;}

  /* ── 底部小字 ── */
  .foot{
    text-align:center;color:#b0b0b0;font-size:11px;margin:24px 14px 8px;
    letter-spacing:.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn-line,.float{transition:none;}
  }
</style>
</head>
