<style>
  :root{
    --orange:#ee4d2d;
    --orange-deep:#f53d2d;
    --line:#06c755;
    --line-deep:#05b04d;
    --ink:#222;
    --muted:#7a7a7a;
    --bg:#f7f7f7;
    --card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}

  /* 手機全寬；桌面居中窄條預覽 */
  .app{
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ── 首屏 Hero：蝦皮橘漸層，一開就懂 ── */
  .hero{
    background:linear-gradient(160deg,#ff7a3d 0%,#f53d2d 55%,#e02d1f 100%);
    padding:calc(44px + env(safe-area-inset-top)) 22px 40px;
    text-align:center;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;
    border-radius:50%;background:rgba(255,255,255,.08);
  }
  .hero::before{
    content:"";position:absolute;left:-40px;bottom:-70px;width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.06);
  }
  .badge{
    display:inline-block;background:rgba(255,255,255,.22);
    color:#fff;font-size:13px;font-weight:700;padding:6px 16px;border-radius:999px;
    letter-spacing:2px;margin-bottom:22px;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    position:relative;z-index:1;
  }
  .hero h1{
    font-size:clamp(34px,10vw,44px);
    line-height:1.25;font-weight:900;letter-spacing:2px;
    position:relative;z-index:1;
  }
  .hero h1 .full{
    display:block;font-size:clamp(20px,6vw,26px);font-weight:700;
    opacity:.96;margin-top:6px;letter-spacing:4px;
  }
  .sub{
    margin-top:14px;color:rgba(255,255,255,.92);font-size:15px;
    letter-spacing:2px;position:relative;z-index:1;
  }

  .btn-line{
    margin-top:30px;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--line);color:#fff;font-weight:800;font-size:17px;
    min-height:58px;padding:0 24px;border-radius:999px;letter-spacing:2px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    position:relative;z-index:1;
    transition:transform .08s ease;
  }
  .btn-line:active{transform:scale(.97);}
  .btn-line svg{flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}
  .btn-hint{
    margin-top:14px;font-size:12px;color:rgba(255,255,255,.78);
    letter-spacing:1px;position:relative;z-index:1;
  }

  /* ── 適合對象 ── */
  .section{
    padding:30px 18px 8px;
  }
  .section-title{
    text-align:center;font-size:19px;font-weight:800;letter-spacing:2px;
    margin-bottom:6px;
  }
  .section-desc{
    text-align:center;color:var(--muted);font-size:13px;letter-spacing:1px;
    margin-bottom:20px;
  }
  .who{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  }
  .who-card{
    background:var(--card);border-radius:16px;padding:22px 8px 18px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .who-card .ic{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,#ff7a3d,var(--orange-deep));
    display:grid;place-items:center;color:#fff;
  }
  .who-card span{font-size:15px;font-weight:700;color:#333;letter-spacing:1px;}

  /* ── 底部說明 ── */
  .foot{
    text-align:center;color:#b0b0b0;font-size:12px;margin:26px 18px 4px;
    letter-spacing:1px;line-height:1.8;
  }

  /* ── 底部浮動 LINE 按鈕 ── */
  .float{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    width:min(480px,calc(100% - 32px));
    background:var(--line);color:#fff;font-weight:800;font-size:16px;
    min-height:56px;padding:0 20px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 8px 24px rgba(6,199,85,.40);
    letter-spacing:2px;z-index:50;
    transition:transform .08s ease;
  }
  .float:active{transform:translateX(-50%) scale(.97);}
  .float svg{flex:none;}

  @media (min-width:520px){
    .float{box-shadow:0 8px 24px rgba(6,199,85,.40);}
  }
</style>
</head>
